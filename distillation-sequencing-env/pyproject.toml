# File design: Standard-library runtime package with separate quality gates
# File purpose: Define installation, tests, and coverage settings
# Author: Yanzhe Fang

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "distillation-sequencing-env"
version = "0.1.0"
description = "Shared four-component distillation sequencing environment."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.3", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
  "--cov=distillation_sequencing_env",
  "--cov-report=term-missing",
  "--cov-fail-under=90",
]
