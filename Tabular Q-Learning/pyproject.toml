# File design: Unified project configuration entry point
# File purpose: Define build, test, and coverage settings
# Author: Yanzhe Fang

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "distillation-tabular-q-learning"
version = "0.1.0"
description = "Tabular Q-learning for a four-component distillation sequence problem."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["distillation-sequencing-env==0.1.0"]

[project.optional-dependencies]
test = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
  "--cov=distillation_q_learning",
  "--cov-report=term-missing",
  "--cov-fail-under=90",
]
